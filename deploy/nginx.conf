server {
    listen 80;
    listen [::]:80;
    server_name asimawdah.com www.asimawdah.com;

    root /var/www/asimawdah.com/out;
    index index.html;

    location = /rss {
        try_files /rss.xml =404;
    }

    location = /rss/ {
        try_files /rss.xml =404;
    }

    location / {
        try_files $uri $uri/ @homepage;
    }

    location @homepage {
        return 302 /;
    }
}
